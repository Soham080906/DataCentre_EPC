[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datacentre-epc-ai-backend"
version = "0.1.0"
description = "AI Intelligence Platform for Data Centre EPC Project Delivery - Backend API"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
